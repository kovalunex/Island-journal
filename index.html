<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#bce8cf"><title>Island Journal</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#294d42;background:#f5f7e9}*{box-sizing:border-box}body{margin:0}header{background:#bce8cf;padding:22px 18px;border-radius:0 0 26px 26px}h1{margin:0;font-size:29px}small{color:#57776d}.wrap{max-width:800px;margin:auto;padding:0 14px 35px}nav{display:flex;gap:7px;overflow-x:auto;padding:14px 0;position:sticky;top:0;background:#f5f7e9}button{cursor:pointer;border:0;border-radius:14px;background:#d8eee1;padding:11px 14px;color:#294d42;font-weight:650;white-space:nowrap}button.active{background:#40816e;color:white}.card{background:white;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 2px 8px #294d4212}h2{margin:0 0 12px;font-size:20px}input,select{border:1px solid #d4dfd8;border-radius:10px;padding:10px;font:inherit;max-width:100%}input[type=checkbox]{accent-color:#40816e;width:19px;height:19px}.task{display:flex;gap:12px;align-items:center;border-bottom:1px solid #eef0e8;padding:10px 0}.task:last-child{border:0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.muted{color:#6c8278;font-size:13px}.stat{font-size:27px;font-weight:750}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.grid .card{margin:0}.bar{background:#e9eee8;border-radius:20px;overflow:hidden;height:10px}.fill{height:100%;background:#4d9d82}.pill{background:#e8f4ea;border-radius:30px;padding:6px 10px;font-size:12px}a{color:#257c65}footer{padding:20px;text-align:center;font-size:12px;color:#75847c}.hidden{display:none}</style></head><body><header><div class="wrap"><div style="font-size:34px">🏝️ 🌿 🐚</div><h1>Island Journal</h1><div>Your cozy New Horizons companion • Switch 2 friendly</div><small id="date"></small></div></header><div class="wrap"><nav id="tabs"></nav><main id="main"></main><footer>Fan-made companion. Not affiliated with Nintendo. Progress is saved in this browser on this device. Export backups regularly.</footer></div><script>
const tabs=['Today','Museum','Villagers','Catalog','DIY','Turnips','Island','Backup'];const tasks=['Check Nook Stop / daily miles','Find four fossils','Find glowing money spot','Hit rocks for materials','Shake trees carefully','Check Nook’s Cranny','Check Able Sisters','Find message bottle','Talk to villagers','Check campsite / visitors','Water flowers','Check Kapp’n / boat tour'];let state;try{state=JSON.parse(localStorage.getItem('islandJournalV1'))||{}}catch{state={}};state.checks ||= {};state.lists ||= {};state.entries ||= {};state.prices ||= {};state.settings ||= {island:'My Island',hemisphere:'Northern'};let tab='Today';const today=()=>new Date().toLocaleDateString('en-CA');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem('islandJournalV1',JSON.stringify(state))}function key(k){return today()+':'+k}function checked(k){return !!state.checks[k]}function taskRow(k,label){return `<label class="task"><input type="checkbox" data-check="${esc(k)}" ${checked(k)?'checked':''}><span style="${checked(k)?'text-decoration:line-through;color:#81988d':''}">${esc(label)}</span></label>`}function section(title,body){return `<section class="card"><h2>${title}</h2>${body}</section>`}function progress(n,d){return `<div class="bar"><div class="fill" style="width:${Math.min(100,100*n/d)}%"></div></div><p class="muted">${n} / ${d} completed (${Math.round(n/d*100)}%)</p>`}function list(id,placeholder){let arr=state.lists[id]||[];return `<div class="row"><input id="entry" placeholder="${esc(placeholder)}"><button data-add="${id}">+ Add</button></div><div style="margin-top:12px">${arr.map((v,i)=>`<div class="task"><input type="checkbox" data-item="${id}" data-index="${i}" ${v.done?'checked':''}><span style="flex:1;${v.done?'text-decoration:line-through;opacity:.6':''}">${esc(v.name)}</span><button data-remove="${id}" data-index="${i}" aria-label="Remove">×</button></div>`).join('')||'<p class="muted">Nothing added yet. Start your collection!</p>'}</div>`}function museum(){let categories=[['Fish',80],['Bugs',80],['Sea creatures',40],['Fossils',73],['Art',43]];return `<div class="grid">${categories.map(([n,total])=>{let v=Math.max(0,Math.min(total,Number(state.entries['museum'+n]||0)));return `<div class="card"><div>${n}</div><div class="stat">${v}<small> / ${total}</small></div>${progress(v,total)}<input aria-label="${n} donated" type="number" min="0" max="${total}" data-museum="${n}" value="${v}" style="width:100%"></div>`}).join('')}</div>${section('Donation notes',list('donations','e.g. Coelacanth'))}<p class="muted">Enter donated totals manually. The totals are for the original New Horizons museum collections; this is not an automatic in-game sync.</p>`}function render(){document.getElementById('date').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'});document.getElementById('tabs').innerHTML=tabs.map(t=>`<button class="${tab===t?'active':''}" data-tab="${t}">${t}</button>`).join('');let html='';if(tab==='Today'){let n=tasks.filter((_,i)=>checked(key('daily'+i))).length;html=section('☀️ Daily checklist',progress(n,tasks.length)+tasks.map((t,i)=>taskRow(key('daily'+i),t)).join(''))+section('📝 Today’s notes',`<textarea id="notes" style="width:100%;height:110px;border:1px solid #d4dfd8;border-radius:12px;padding:12px;font:inherit" placeholder="Visitors, goals, discoveries...">${esc(state.entries['notes'+today()]||'')}</textarea>`)}if(tab==='Museum')html=museum();if(tab==='Villagers')html=section('🏡 Your villagers',list('villagers','Villager name'))+section('🎁 Gift ideas',list('gifts','e.g. Maple — wrapped fruit'));if(tab==='Catalog')html=section('🛋️ Furniture & clothing',list('catalog','Item or variation name'))+section('⭐ Wishlist',list('wishlist','Item you want'))+section('🔎 Research',`<p>Search detailed item variations and unlock conditions at <a href="https://nookipedia.com/wiki/Animal_Crossing:_New_Horizons" target="_blank">Nookipedia</a> or <a href="https://villagerdb.com/" target="_blank">VillagerDB</a>.</p>`);if(tab==='DIY')html=section('🛠️ DIY recipes learned',list('diys','Recipe name'))+section('🧰 Recipes to find',list('diywish','Missing DIY recipe'));if(tab==='Turnips'){let p=state.prices;html=section('💰 Turnip tracker',`<label>Sunday purchase price <input type="number" min="0" id="buy" value="${esc(p.buy||'')}"></label><p class="muted">Enter each morning/afternoon price as you check Nook's Cranny.</p>${['Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="task"><strong style="width:45px">${d}</strong>${['AM','PM'].map(a=>`<label>${a} <input type="number" min="0" data-price="${d+a}" value="${esc(p[d+a]||'')}" style="width:86px"></label>`).join('')}</div>`).join('')}<p><a target="_blank" href="https://turnipprophet.io/">Analyze these prices with Turnip Prophet</a></p>`)}if(tab==='Island')html=section('🌴 Island profile',`<label>Island name <input id="island" value="${esc(state.settings.island)}"></label><p><label>Hemisphere <select id="hemisphere"><option ${state.settings.hemisphere==='Northern'?'selected':''}>Northern</option><option ${state.settings.hemisphere==='Southern'?'selected':''}>Southern</option></select></label></p>`)+section('🗺️ Island projects',list('projects','e.g. Build a forest entrance'))+section('✨ Useful tools',`<p><a target="_blank" href="https://eugeneration.github.io/HappyIslandDesigner/">Happy Island Designer</a> · <a target="_blank" href="https://wuffs.org/acnh/weather/">MeteoNook</a> · <a target="_blank" href="https://acnh.directory/">ACNH Directory</a></p>`);if(tab==='Backup')html=section('💾 Save your progress',`<p>Your entries stay in this browser, not in your Nintendo account. Clearing Safari website data may erase them.</p><div class="row"><button id="export">Export JSON backup</button><label class="pill">Import backup <input id="import" type="file" accept="application/json" style="max-width:180px"></label></div><p class="muted">For an offline copy, save this HTML file to Files and open it in a compatible browser. Browser storage behavior may vary for local files.</p>`);document.getElementById('main').innerHTML=html}document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render()}else if(b.dataset.add){let input=document.getElementById('entry'),v=input.value.trim();if(v){(state.lists[b.dataset.add]||=[]).push({name:v,done:false});save();render()}}else if(b.dataset.remove){state.lists[b.dataset.remove].splice(+b.dataset.index,1);save();render()}else if(b.id==='export'){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='island-journal-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}});document.addEventListener('change',e=>{let t=e.target;if(t.dataset.check){state.checks[t.dataset.check]=t.checked;save();render()}else if(t.dataset.item){state.lists[t.dataset.item][+t.dataset.index].done=t.checked;save();render()}else if(t.dataset.museum){let total={Fish:80,Bugs:80,'Sea creatures':40,Fossils:73,Art:43}[t.dataset.museum];state.entries['museum'+t.dataset.museum]=Math.max(0,Math.min(total,Number(t.value)||0));save();render()}else if(t.dataset.price){state.prices[t.dataset.price]=t.value;save()}else if(t.id==='buy'){state.prices.buy=t.value;save()}else if(t.id==='island'){state.settings.island=t.value;save()}else if(t.id==='hemisphere'){state.settings.hemisphere=t.value;save()}else if(t.id==='import'&&t.files[0]){let reader=new FileReader();reader.onload=()=>{try{let obj=JSON.parse(reader.result);if(!obj||typeof obj!=='object'||Array.isArray(obj))throw Error();state=obj;state.checks ||= {};state.lists ||= {};state.entries ||= {};state.prices ||= {};state.settings ||= {island:'My Island',hemisphere:'Northern'};save();render();alert('Backup imported!')}catch{alert('Could not read backup file.')}};reader.readAsText(t.files[0])}});document.addEventListener('input',e=>{if(e.target.id==='notes'){state.entries['notes'+today()]=e.target.value;save()}});render();</script></body></html>
